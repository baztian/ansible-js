---
- name: Update apt cache.
  apt:
    update_cache: yes
    cache_valid_time: 3600
- name: Install repository dependencies
  apt:
    pkg:
      - ca-certificates
      - python3-debian
- name: Remove legacy NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ item }} signed-by=/etc/apt/trusted.gpg.d/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major_release }}.x nodistro main"
    state: absent
    update_cache: false
  loop: "{{ ['amd64', ansible_architecture] | unique | list }}"
- name: Add apt repo for Nodejs
  ansible.builtin.deb822_repository:
    name: js-nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ node_major_release }}.x"
    suites: nodistro
    components: main
    architectures: amd64
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present
  register: nodesource_repository
- name: Install NodeJS
  apt:
    pkg: nodejs
    update_cache: "{{ nodesource_repository.changed }}"
- name: Install browser-sync
  npm:
    name: browser-sync
    global: yes
    version: "{{ browser_sync_version }}"
  environment:
    npm_config_prefix: "{{ npm_config_prefix }}"
  tags: browser-sync
